<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2433;--muted:#6b7385;--line:#e3e6ec;--accent:#1f6f5c;--accent2:#e8f3ef;--red:#c0392b;--green:#1e8449;--amber:#b9770e}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
.app{display:flex;min-height:100vh}
nav{width:215px;background:#17322b;color:#fff;padding:18px 10px;flex-shrink:0}
nav h1{font-size:19px;margin:0 8px 18px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#cfe3dc;padding:10px 12px;border-radius:8px;font-size:15px;cursor:pointer;margin-bottom:2px}
nav button.active,nav button:hover{background:#25483f;color:#fff}
#updBar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#17322b;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center;z-index:50;font-size:15px}
#updBar .btn{background:#4fbf9f;color:#0d2620;font-weight:600}
#status{color:#9fbfb5;margin:24px 8px 0;font-size:12px;line-height:1.5}
main{flex:1;padding:24px;max-width:1150px}
h2{margin:0 0 16px;font-size:22px}
h3{margin:0 0 10px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.grid .card{margin-bottom:0}
.grid+.card,.grid+.grid{margin-top:16px}
.stat .lbl{color:var(--muted);font-size:13px}
.stat .val{font-size:22px;font-weight:600;margin-top:4px}
.pos{color:var(--green)}.neg{color:var(--red)}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:middle}
th{color:var(--muted);font-weight:500}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.total td{font-weight:600;border-bottom:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}
input,select,textarea{font:inherit;padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);min-width:0}
textarea{min-height:150px;width:100%}
button.btn{font:inherit;background:var(--accent);color:#fff;border:0;border-radius:7px;padding:8px 14px;cursor:pointer}
button.btn.sec{background:var(--accent2);color:var(--accent)}
button.btn.danger{background:#fbeaea;color:var(--red)}
button.link{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 4px}
button.link:hover{color:var(--accent)}
button.link.del:hover{color:var(--red)}
.bar{height:10px;background:#eceef2;border-radius:6px;overflow:hidden;min-width:80px}
.bar>div{height:100%;background:var(--accent)}
.bar>div.over{background:var(--red)}

.warn{background:#fff6e5;border:1px solid #f3dcaa;color:#7a5200;padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:16px}
.warn a{color:#7a5200;font-weight:600}
.ok{background:#e9f6ee;border:1px solid #bfe3cc;color:#1e5e37;padding:10px 12px;border-radius:8px;font-size:14px}
.alert{padding:8px 10px;border-radius:8px;margin:6px 0;font-size:14px}
.alert.red{background:#fbeaea;color:#8e2a1f}.alert.amber{background:#fff6e5;color:#7a5200}.alert.info{background:#eef3fb;color:#24456e}.alert.green{background:#e9f6ee;color:#1e5e37}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
#overlay .card{max-width:820px;width:100%;max-height:90vh;display:flex;flex-direction:column}
#overlay textarea{flex:1;min-height:50vh;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.srch{border:1px solid var(--line);border-radius:8px;margin-top:8px;max-height:240px;overflow:auto}
.srch div{padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--line);font-size:14px}.srch div:hover{background:var(--accent2)}

.lockbox{background:#fff;border-radius:16px;padding:28px 24px;width:100%;max-width:360px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.lockbox input{width:100%;font-size:17px;padding:11px;text-align:center}
.lockbox .btn{width:100%;margin-top:10px;padding:11px;font-size:16px}
ol{margin:6px 0 0;padding-left:20px;line-height:1.8}
.scroll{overflow-x:auto}
@media (max-width:760px){.app{flex-direction:column}nav{width:auto;display:flex;flex-wrap:wrap;gap:4px}nav h1{width:100%;margin-bottom:6px}nav button{width:auto}#status{display:none}main{padding:14px}}

<body>
<div class="app">
<nav>
  <h1>🏠 Aile Finans</h1>
  <button data-tab="ozet" onclick="show('ozet')">📊 Özet</button>
  <button data-tab="islem" onclick="show('islem')">💸 Gelir / Gider</button>

  <div id="status"></div>
</nav>
<main id="main"></main>

<script>
'use strict';
// ---------- Yardımcılar ----------
const KEY = 'aileFinans_v1';
const APP_VERSION = '1.8.1';
const AYLAR = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const CURS = [['TRY','TL'],['EUR','Euro'],['USD','Dolar']];
const CURS_A = [...CURS, ['GAU','Gram altın']];
const ATYPES = ['Nakit/Banka','Döviz','Altın','Hisse/Fon','Gayrimenkul','Araç','Diğer','Borç'];
const NON_FIN = ['Gayrimenkul','Araç'];
const DEBT_CAT = 'Kredi/Borç ödemesi', BES_CAT = 'BES katkısı', INS_CAT = 'Hayat sigortası primi';
const FREQS = [[1,'Aylık'],[3,'3 ayda bir'],[6,'6 ayda bir'],[12,'Yıllık']];
const nf = new Intl.NumberFormat('tr-TR',{maximumFractionDigits:0});
const nf2 = new Intl.NumberFormat('tr-TR',{maximumFractionDigits:2});

function pad2(n){ return String(n).padStart(2,'0'); }
function today(){ const d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function ym(s){ return String(s).slice(0,7); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){ if(!d) return ''; const [y,m,dd]=d.split('-'); return dd+'.'+m+'.'+y; }
function mLabel(m){ return AYLAR[+m.slice(5)-1]+' '+m.slice(2,4); }
function num(v){ const n=parseFloat(v); return isNaN(n)?0:n; }
const SYM={TRY:'₺',EUR:'€',USD:'$',GBP:'£',GBX:'p'};
function money2(v,cur='TRY'){ return nf2.format(v)+' '+(SYM[cur]||cur); }
function money(v,cur='TRY'){
  if(cur==='GAU') return nf2.format(v)+' gr';
  const sym=SYM[cur]||cur;
  return nf.format(Math.round(v))+' '+sym;
}
function short(v){ if(Math.abs(v)>=1e6) return nf2.format(v/1e6)+' M €'; if(Math.abs(v)>=1e3) return nf.format(v/1e3)+' B €'; return nf.format(v)+' €'; }
function opts(arr,sel){ return arr.map(v=>`<option${v===sel?' selected':''}>${esc(v)}</option>`).join(''); }
function optsKV(pairs,sel){ return pairs.map(([k,v])=>`<option value="${k}"${k===sel?' selected':''}>${esc(v)}</option>`).join(''); }
function lastMonths(n){ const out=[]; const d=new Date(); for(let i=n-1;i>=0;i--){ const x=new Date(d.getFullYear(),d.getMonth()-i,1); out.push(x.getFullYear()+'-'+pad2(x.getMonth()+1)); } return out; }
function monthsBetween(a,b){ const [ay,am,ad]=a.split('-').map(Number); const [by,bm,bd]=b.split('-').map(Number); return (by-ay)*12+(bm-am)-(bd>=ad?0:1); }
function daysSince(d){ return Math.floor((new Date(today())-new Date(d))/86400000); }

// ---------- Veri ----------
function defaults(){
  return {
    version:1,
    settings:{
      members:['Ben','Eşim'],
      expenseCats:['Market','Faturalar','Kira/Aidat','Ulaşım/Araç','Eğitim','Sağlık','Giyim','Yeme-İçme','Eğlence','Tatil','Kredi/Borç ödemesi','Diğer'],
      incomeCats:['Maaş','Ticari gelir','Kira geliri','Temettü','Faiz','Diğer'],
      rates:{EUR:0,USD:0,GAU:0,GBP:0}, avKey:'', ratesDate:'', ratesSourceDate:'', autoRates:true, lastBackup:''
    },
    transactions:[], budgets:{}, assets:[], goals:[], bes:[], policies:[], stocks:[],
    retirement:{age:48,retireAge:58,lifeTo:90,monthlyNeed:5000,current:0,monthly:0,realReturn:3.5,wr:3.5,lump:0}
  };
}
function merge(d,s){
  for(const k in d){
    if(s[k]===undefined || s[k]===null) s[k]=d[k];
    else if(d[k] && typeof d[k]==='object' && !Array.isArray(d[k])) merge(d[k],s[k]);
  }
  return s;
}
function validData(d){ return d && typeof d==='object' && Array.isArray(d.transactions) && d.settings && typeof d.settings==='object'; }

// ---------- Şifreleme (parola + parmak izi) ----------
// Veriler AES-256-GCM ile şifrelenir. Veri anahtarı (DK) parolayla (PBKDF2) ve isteğe bağlı olarak
// parmak izi / Windows Hello (WebAuthn PRF) ile ayrı ayrı sarılır; parola bilinmeden veri okunamaz.
const TE=new TextEncoder(), TD=new TextDecoder();
function b64e(buf){ const u=new Uint8Array(buf); let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }
function b64d(str){ const s=atob(str), u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
function rnd(n){ return crypto.getRandomValues(new Uint8Array(n)); }
async function pwKey(pw,salt){
  const base=await crypto.subtle.importKey('raw',TE.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function aesEnc(key,data){ const iv=rnd(12); const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,data); return {iv:b64e(iv),ct:b64e(ct)}; }
async function aesDec(key,o){ return crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(o.iv)},key,b64d(o.ct)); }
function importAes(raw){ return crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['encrypt','decrypt']); }

let S=null, LOCK=null, encStored=null, DK=null, DKraw=null;
try { const raw=localStorage.getItem(KEY); if(raw){ const d=JSON.parse(raw);
  if(d && d.enc){ encStored=d; LOCK=d.lock; } else if(validData(d)) S=merge(defaults(),d); } } catch(e){ console.error(e); }
if(!S && !encStored) S = defaults();

let fileHandle = null, writeChain = Promise.resolve(), storeChain = Promise.resolve(), lastSave = null, fileError = '';
function save(){
  if(!S || (LOCK && !DK)) return;           // kilitliyken asla şifresiz yazma
  const json=JSON.stringify(S), key=LOCK?DK:null, lock=LOCK?JSON.parse(JSON.stringify(LOCK)):null;
  storeChain = storeChain.then(()=>writeStore(json,key,lock)).then(()=>{ lastSave=new Date(); updateStatus(); })
    .catch(e=>alert('Veriler tarayıcıya kaydedilemedi: '+e.message+'\nLütfen Ayarlar sekmesinden yedek alın.'));
  if(fileHandle){ writeChain = writeChain.then(()=>writeFile(json,key,lock)); }
  updateStatus();
}
async function writeStore(json,key,lock){
  if(key){ const o=await aesEnc(key,TE.encode(json)); localStorage.setItem(KEY, JSON.stringify({enc:1, lock, iv:o.iv, ct:o.ct})); }
  else localStorage.setItem(KEY, json);
}
// Yedek/dosya içeriği: kilit açıksa parolayla açılabilen şifreli paket
async function makeExport(json,key,lock){
  if(!(key && lock)) return JSON.stringify(JSON.parse(json),null,2);
  const o=await aesEnc(key,TE.encode(json));
  return JSON.stringify({aileFinansEncrypted:1, v:1, pw:lock.pw, data:o});
}
async function writeFile(json,key,lock){
  try {
    const text=await makeExport(json,key,lock);
    const w = await fileHandle.createWritable();
    await w.write(text);
    await w.close();
    fileError='';
  } catch(e){ console.error(e); fileError='Dosyaya yazılamadı ('+e.message+')'; }
  updateStatus();
}
function askPassword(title){
  return new Promise(res=>{
    const o=document.createElement('div'); o.id='overlay'; o.style.zIndex=110;
    o.innerHTML=`<div class="card" style="max-width:380px"><h3>${esc(title)}</h3><form><input type="password" name="pw" style="width:100%;font-size:16px;padding:9px" autocomplete="current-password">
      <div class="row" style="margin-top:12px"><button class="btn">Tamam</button><button type="button" class="btn sec">Vazgeç</button></div></form></div>`;
    document.body.appendChild(o); const f=o.querySelector('form'); f.pw.focus();
    f.onsubmit=e=>{ e.preventDefault(); o.remove(); res(f.pw.value); };
    f.querySelector('.sec').onclick=()=>{ o.remove(); res(null); };
  });
}
async function readExport(text){
  let d=JSON.parse(text);
  if(d && d.aileFinansEncrypted){
    const pw=await askPassword('Bu yedek şifreli. Yedeği alırken kullandığın parolayı gir:');
    if(pw==null) throw new Error('İptal edildi.');
    let raw; try { raw=await aesDec(await pwKey(pw,b64d(d.pw.salt)),d.pw); } catch(e){ throw new Error('Parola yanlış.'); }
    d=JSON.parse(TD.decode(await aesDec(await importAes(new Uint8Array(raw)),d.data)));
  }
  if(!validData(d)) throw new Error('Bu dosya Aile Finans verisi değil.');
  return d;
}

// ---- Kilit ekranı
const BIO_OK = !!(window.PublicKeyCredential && window.isSecureContext && location.protocol!=='file:');
function showLock(msg){
  document.querySelector('.app').style.display='none';
  const ov=document.getElementById('overlay'); if(ov) ov.remove();
  let o=document.getElementById('lock'); if(!o){ o=document.createElement('div'); o.id='lock'; document.body.appendChild(o); }
  const bio = BIO_OK && LOCK && LOCK.bio;
  o.innerHTML=`<div class="lockbox"><div style="font-size:44px">🏠🔒</div><h2 style="margin:6px 0 4px">Aile Finans</h2>
    <p class="note" style="margin-bottom:16px">Verilerin şifreli. Devam etmek için kilidi aç.</p>
    ${bio?`<button class="btn" onclick="unlockBio()">👆 Parmak izi / Windows Hello ile aç</button><p class="note" style="margin:14px 0 4px">ya da</p>`:''}
    <form onsubmit="unlockPw(event)"><input type="password" name="pw" placeholder="Parola" autocomplete="current-password">
    <button class="btn ${bio?'sec':''}">Parola ile aç</button></form>
    <p id="lockMsg" class="neg" style="min-height:22px;margin:12px 0 0">${esc(msg||'')}</p></div>`;
  if(!bio) setTimeout(()=>{ const i=o.querySelector('input'); if(i) i.focus(); },50);
}
function lockMsg(t,ok){ const m=document.getElementById('lockMsg'); if(m){ m.textContent=t; m.className=ok?'note':'neg'; } }
async function unlockPw(ev){
  ev.preventDefault(); const pw=ev.target.pw.value; if(!pw) return;
  lockMsg('⏳ Açılıyor…',true);
  let raw; try { raw=await aesDec(await pwKey(pw,b64d(LOCK.pw.salt)),LOCK.pw); }
  catch(e){ ev.target.pw.value=''; lockMsg('Parola yanlış. Tekrar dene.'); return; }
  finishUnlock(raw);
}
async function bioSecret(id,salt){
  const a=await navigator.credentials.get({publicKey:{challenge:rnd(32), allowCredentials:[{type:'public-key',id}], userVerification:'required', timeout:60000,
    extensions:{prf:{eval:{first:salt}}}}});
  const r=a.getClientExtensionResults();
  if(!r.prf || !r.prf.results || !r.prf.results.first) throw new Error('Bu cihaz parmak iziyle şifre çözmeyi desteklemiyor.');
  return r.prf.results.first;
}
async function unlockBio(){
  lockMsg('👆 Parmak izini okut…',true);
  try {
    const sec=await bioSecret(b64d(LOCK.bio.id), b64d(LOCK.bio.salt));
    const raw=await aesDec(await importAes(sec), LOCK.bio);
    finishUnlock(raw);
  } catch(e){ lockMsg('Parmak iziyle açılamadı. Parolanı kullan.'); const i=document.querySelector('#lock input'); if(i) i.focus(); }
}
async function finishUnlock(raw){
  DKraw=new Uint8Array(raw); DK=await importAes(DKraw);
  if(encStored){
    try { S=merge(defaults(), JSON.parse(TD.decode(await aesDec(DK,encStored)))); }
    catch(e){ DK=null; DKraw=null; lockMsg('Veriler çözülemedi: dosya bozulmuş olabilir. Yedekten yüklemeyi dene.'); return; }
    encStored=null;
  }
  if(!S) S=defaults();
  const o=document.getElementById('lock'); if(o) o.remove();
  document.querySelector('.app').style.display='';
  lastAct=Date.now(); boot();
}
async function lockNow(){
  if(!LOCK) return;
  await storeChain; await writeChain;
  S=null; DK=null; DKraw=null; editId=editAsset=editBes=editPol=editStock=null;
  try { const d=JSON.parse(localStorage.getItem(KEY)); if(d && d.enc){ encStored=d; LOCK=d.lock; } } catch(e){}
  document.getElementById('main').innerHTML='';
  showLock();
}
let lastAct=Date.now();
['mousemove','mousedown','keydown','touchstart','scroll','wheel'].forEach(ev=>window.addEventListener(ev,()=>{ lastAct=Date.now(); },{passive:true}));
setInterval(()=>{ if(LOCK && DK && num(LOCK.autoMin)>0 && Date.now()-lastAct>num(LOCK.autoMin)*60000) lockNow(); },15000);

// ---- Kilit ayarları
async function enableLock(ev){
  ev.preventDefault(); const f=ev.target, p1=f.p1.value, p2=f.p2.value;
  if(p1.length<6){ alert('Parola en az 6 karakter olmalı.'); return; }
  if(p1!==p2){ alert('Parolalar aynı değil.'); return; }
  if(!confirm('ÖNEMLİ: Parolanı unutursan verilerini kimse (biz dahil) açamaz.\nParolayı güvenli bir yere yazdığından emin ol.\n\nKilidi açalım mı?')) return;
  const raw=rnd(32), salt=rnd(16), w=await aesEnc(await pwKey(p1,salt), raw);
  LOCK={v:1, pw:{salt:b64e(salt), iv:w.iv, ct:w.ct}, autoMin:10};
  DKraw=raw; DK=await importAes(raw);
  save(); await storeChain; render();
  alert('🔒 Kilit açıldı ve verilerin şifrelendi.'+(BIO_OK?'\nİstersen şimdi parmak izi / Windows Hello da ekleyebilirsin.':''));
}
async function changePw(ev){
  ev.preventDefault(); const f=ev.target;
  try { await aesDec(await pwKey(f.old.value,b64d(LOCK.pw.salt)),LOCK.pw); } catch(e){ alert('Mevcut parola yanlış.'); return; }
  if(f.p1.value.length<6){ alert('Yeni parola en az 6 karakter olmalı.'); return; }
  if(f.p1.value!==f.p2.value){ alert('Yeni parolalar aynı değil.'); return; }
  const salt=rnd(16), w=await aesEnc(await pwKey(f.p1.value,salt), DKraw);
  LOCK.pw={salt:b64e(salt), iv:w.iv, ct:w.ct}; save(); await storeChain; render();
  alert('Parola değiştirildi. Not: Daha önce aldığın şifreli yedekler eski parolayla açılır.');
}
async function disableLock(){
  const pw=await askPassword('Kilidi kapatmak için parolanı gir:'); if(pw==null) return;
  try { await aesDec(await pwKey(pw,b64d(LOCK.pw.salt)),LOCK.pw); } catch(e){ alert('Parola yanlış.'); return; }
  if(!confirm('Kilit kapatılırsa veriler şifresiz saklanır ve program parola sormaz. Emin misin?')) return;
  LOCK=null; DK=null; DKraw=null; save(); await storeChain; render();
}
async function enrollBio(){
  try {
    if(!(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())){ alert('Bu bilgisayarda parmak izi / Windows Hello / Touch ID kurulu görünmüyor. Önce işletim sisteminin ayarlarından kur.'); return; }
    const salt=rnd(32);
    const cred=await navigator.credentials.create({publicKey:{
      rp:{name:'Aile Finans'}, user:{id:rnd(16), name:'aile-finans', displayName:'Aile Finans'}, challenge:rnd(32),
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform', userVerification:'required', residentKey:'preferred'},
      timeout:60000, extensions:{prf:{eval:{first:salt}}}}});
    const ext=cred.getClientExtensionResults();
    if(!ext.prf || ext.prf.enabled===false){ alert('Bu bilgisayar/tarayıcı, parmak iziyle veri şifrelemeyi (WebAuthn PRF) desteklemiyor. Parola ile devam edebilirsin; Chrome\'u güncellemek işe yarayabilir.'); return; }
    let sec=ext.prf.results && ext.prf.results.first;
    if(!sec){ alert('Kurulumu tamamlamak için parmak izini bir kez daha okutman istenecek.'); sec=await bioSecret(cred.rawId,salt); }
    const w=await aesEnc(await importAes(sec), DKraw);
    LOCK.bio={id:b64e(cred.rawId), salt:b64e(salt), iv:w.iv, ct:w.ct};
    save(); await storeChain; render(); alert('👆 Parmak izi eklendi. Bundan sonra programı parmak izinle açabilirsin.');
  } catch(e){ if(e.name!=='NotAllowedError') alert('Parmak izi eklenemedi: '+e.message); }
}

const RATE_URLS=['https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/eur.min.json',
                 'https://latest.currency-api.pages.dev/v1/currencies/eur.min.json'];
const ECB_URL='https://api.frankfurter.dev/v1/latest?base=EUR&symbols=TRY,USD,GBP';
const OZ=31.1034768;
let ratesBusy=false, ratesMsg='';
function formDirty(){
  return [...document.querySelectorAll('main form input, main form select, main form textarea')].some(el=>
    el.type==='checkbox' ? el.checked!==el.defaultChecked :
    el.tagName==='SELECT' ? el.selectedIndex!==Math.max(0,[...el.options].findIndex(o=>o.defaultSelected)) : el.value!==el.defaultValue);
}
async function getJSON(u){
  const c=new AbortController(), t=setTimeout(()=>c.abort(),10000);
  try { const r=await fetch(u,{signal:c.signal,cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
async function fetchRates(manual){
  if(ratesBusy) return; ratesBusy=true; ratesMsg='⏳ Kurlar güncelleniyor…'; updateStatus();
  let res=null, err='';
  for(const u of RATE_URLS){
    try { const d=await getJSON(u), e=d.eur;
      if(e && e.try>1 && e.usd>0){ res={EUR:e.try, USD:e.try/e.usd, GBP:e.gbp>0?e.try/e.gbp:0, GAU:e.xau>0?e.try/e.xau/OZ:0, date:d.date}; break; }
    } catch(x){ err=x.name==='AbortError'?'zaman aşımı':x.message; }
  }
  if(!res){
    try { const d=await getJSON(ECB_URL);
      if(d.rates && d.rates.TRY>1 && d.rates.USD>0) res={EUR:d.rates.TRY, USD:d.rates.TRY/d.rates.USD, GBP:d.rates.GBP>0?d.rates.TRY/d.rates.GBP:0, GAU:0, date:d.date};
    } catch(x){ err=x.name==='AbortError'?'zaman aşımı':x.message; }
  }
  ratesBusy=false;
  if(res){
    const r=S.settings.rates;
    r.EUR=+res.EUR.toFixed(4); r.USD=+res.USD.toFixed(4); if(res.GBP>0) r.GBP=+res.GBP.toFixed(4); if(res.GAU>0) r.GAU=+res.GAU.toFixed(2);
    S.settings.ratesDate=today(); S.settings.ratesSourceDate=res.date||'';
    ratesMsg='🌐 Kurlar güncellendi'+(res.date?' ('+fmtDate(res.date)+')':'')+(res.GAU>0?'':' · altın alınamadı');
    save();
  } else {
    ratesMsg='⚠️ Kurlar internetten alınamadı'+(err?' ('+err+')':'');
    updateStatus();
    if(manual) alert('Kurlar internetten alınamadı. İnternet bağlantını kontrol et ya da kurları elle gir.');
  }
  // Form doldururken yazdıklarını silmemek için sadece formsuz ekranları yenile
  if(manual || (res && !formDirty())) render();
}

// ---------- Hesaplar ----------
function rate(cur){ return cur==='TRY' ? 1 : cur==='GBX' ? num(S.settings.rates.GBP)/100 : num(S.settings.rates[cur]); }
function toTRY(amount,cur){ return num(amount)*rate(cur); }
function monthTotals(m){
  let inc=0, exp=0; const byCat={};
  for(const t of S.transactions){
    if(ym(t.date)!==m) continue;
    const v=toTRY(t.amount,t.currency);
    if(t.type==='gelir') inc+=v;
    else { exp+=v; byCat[t.category]=(byCat[t.category]||0)+v; }
  }
  return {inc,exp,byCat};
}
function isInstDebt(a){ return a.type==='Borç' && num(a.inst)>0; }
function assetTRY(a){
  if(isInstDebt(a)) return toTRY(num(a.inst)*num(a.left), a.currency);
  return toTRY(num(a.qty)*(a.price===''||a.price==null?1:num(a.price)), a.currency);
}
function assetDivTRY(a){ return toTRY(num(a.qty)*num(a.div), a.currency==='GAU'?'TRY':a.currency); }
function worth(){
  let assets=0, debt=0, fin=0, div=0;
  for(const a of S.assets){
    const v=assetTRY(a);
    if(a.type==='Borç'){ debt+=v; fin-=v; }
    else { assets+=v; if(!NON_FIN.includes(a.type)) fin+=v; }
    div+=assetDivTRY(a);
  }
  let bes=0;
  for(const b of S.bes){ const v=besVested(b); assets+=v; fin+=v; bes+=v; }
  let ins=0;
  for(const p of S.policies){ const v=toTRY(p.value,p.currency); assets+=v; fin+=v; ins+=v; }
  let stk=0;
  for(const x of S.stocks){ if(num(x.shares)>0){ const c=stockCalc(x); assets+=c.valTRY; fin+=c.valTRY; stk+=c.valTRY; div+=c.divTRY; } }
  return {assets,debt,net:assets-debt,fin,div,bes,ins,stk};
}
// ---------- Otomatik aylık ödemeler (borç taksitleri, BES katkıları) ----------
function addMonths(m,k){ let [y,mo]=m.split('-').map(Number); mo+=k; while(mo>12){mo-=12;y++;} while(mo<1){mo+=12;y--;} return y+'-'+pad2(mo); }
function monthDiff(a,b){ const [ay,am]=a.split('-').map(Number), [by,bm]=b.split('-').map(Number); return (by-ay)*12+(bm-am); }
function nextMonth(m){ let [y,mo]=m.split('-').map(Number); mo++; if(mo>12){mo=1;y++;} return y+'-'+pad2(mo); }
function prevMonth(m){ let [y,mo]=m.split('-').map(Number); mo--; if(mo<1){mo=12;y--;} return y+'-'+pad2(mo); }
function dueDate(m,day){ const [y,mo]=m.split('-').map(Number); const last=new Date(y,mo,0).getDate(); return m+'-'+pad2(Math.min(Math.max(1,num(day)||1),last)); }
function ensureCat(c){ if(!S.settings.expenseCats.includes(c)) S.settings.expenseCats.push(c); }
function addAuto(date,cat,amount,cur,note,src){
  ensureCat(cat);
  S.transactions.push({id:uid(), date, type:'gider', category:cat, amount:num(amount), currency:cur, member:'Ortak', note:'🔁 '+note, auto:src});
}
function processRecurring(){
  const t=today(), cur=ym(t); let n=0;
  for(const a of S.assets){
    if(!isInstDebt(a) || !a.lastPosted) continue;
    let m=nextMonth(a.lastPosted), guard=0;
    while(num(a.left)>0 && m<=cur && guard++<240){
      const d=dueDate(m,a.day); if(d>t) break;
      addAuto(d,DEBT_CAT,a.inst,a.currency,a.name+' taksiti',a.id);
      a.left=num(a.left)-1; a.lastPosted=m; n++; m=nextMonth(m);
    }
  }
  for(const b of S.bes){
    if(!(num(b.monthly)>0) || !b.lastPosted) continue;
    let m=nextMonth(b.lastPosted), guard=0;
    while(m<=cur && guard++<240){
      const d=dueDate(m,b.day); if(d>t) break;
      addAuto(d,BES_CAT,b.monthly,'TRY',b.name+' BES katkısı',b.id);
      besInvest(b, num(b.monthly), num(b.monthly)*num(b.rate)/100);
      b.lastPosted=m; n++; m=nextMonth(m);
    }
  }
  for(const p of S.policies){
    if(!(num(p.premium)>0) || !p.lastPosted) continue;
    const f=num(p.freq)||1; let m=addMonths(p.lastPosted,f), guard=0;
    while(m<=cur && guard++<240){
      const d=dueDate(m,p.day); if(d>t || (p.end && d>p.end)) break;
      addAuto(d,INS_CAT,p.premium,p.currency,p.name+' primi',p.id);
      p.lastPosted=m; n++; m=addMonths(m,f);
    }
  }
  if(n){ save(); autoMsg='🔁 '+n+' otomatik ödeme gider olarak eklendi'; }
  return n;
}
// Yeni eklenen taksit/katkı için başlangıç ayını belirler
function initRecurring(item,amount,cur,note,cat,what){
  const m=ym(today()), d=dueDate(m,item.day);
  if(d<=today()){
    if(confirm(`Bu ayın ödeme günü (${fmtDate(d)}) geçmiş.\n\n${money(amount,cur)} tutarındaki bu ayın ödemesi bu ayın giderlerine eklensin mi?\n\n(${what} bu ödemeden SONRAKİ haliyle girdiğini varsayıyorum; bu yüzden değiştirilmeyecek.)`))
      addAuto(d,cat,amount,cur,note,item.id);
    item.lastPosted=m;
  } else item.lastPosted=prevMonth(m);
  ensureCat(cat);
}
let autoMsg='';
function autoLimit(c){
  if(c===DEBT_CAT) return S.assets.filter(a=>isInstDebt(a)&&num(a.left)>0).reduce((s,a)=>s+toTRY(a.inst,a.currency),0);
  if(c===BES_CAT) return S.bes.reduce((s,b)=>s+num(b.monthly),0);
  if(c===INS_CAT) return fixedPayments().filter(x=>x.kind==='Sigorta').reduce((s,x)=>s+x.amount,0);
  return 0;
}
function effLimit(c){ return S.budgets[c]>0 ? S.budgets[c] : autoLimit(c); }
function fixedPayments(){
  const cur=ym(today()), out=[];
  for(const a of S.assets) if(isInstDebt(a) && (num(a.left)>0 || (a.lastPosted||'')>=cur))
    out.push({name:a.name, kind:'Taksit', day:a.day, amount:toTRY(a.inst,a.currency), done:(a.lastPosted||'')>=cur, left:num(a.left)});
  for(const b of S.bes) if(num(b.monthly)>0)
    out.push({name:b.name, kind:'BES', day:b.day, amount:num(b.monthly), done:(b.lastPosted||'')>=cur});
  for(const p of S.policies){
    if(!(num(p.premium)>0) || !p.lastPosted) continue;
    const f=num(p.freq)||1, done=p.lastPosted===cur, due=addMonths(p.lastPosted,f)===cur;
    if((done || due) && !(p.end && dueDate(cur,p.day)>p.end))
      out.push({name:p.name, kind:'Sigorta', day:p.day, amount:toTRY(p.premium,p.currency), done, cur:p.currency, orig:num(p.premium)});
  }
  return out.sort((x,y)=>num(x.day)-num(y.day));
}

function barChart(){
  const ms=lastMonths(6), data=ms.map(monthTotals);
  const max=Math.max(1,...data.flatMap(d=>[d.inc,d.exp]));
  const W=600,H=190,bw=W/ms.length;
  let s=`<svg viewBox="0 0 ${W} ${H+28}" width="100%" role="img" aria-label="Son 6 ay gelir gider">`;
  data.forEach((d,i)=>{
    const x=i*bw, hi=d.inc/max*H, he=d.exp/max*H;
    s+=`<rect x="${(x+bw*0.16).toFixed(1)}" y="${(H-hi).toFixed(1)}" width="${(bw*0.32).toFixed(1)}" height="${hi.toFixed(1)}" fill="#1e8449" rx="3"><title>Gelir: ${money(d.inc)}</title></rect>`;
    s+=`<rect x="${(x+bw*0.52).toFixed(1)}" y="${(H-he).toFixed(1)}" width="${(bw*0.32).toFixed(1)}" height="${he.toFixed(1)}" fill="#c0392b" rx="3"><title>Gider: ${money(d.exp)}</title></rect>`;
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${H+19}" text-anchor="middle" font-size="12" fill="#6b7385">${mLabel(ms[i])}</text>`;

function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function upcomingPayments(nDays){
  const t=today(), out=[];
  const add=(name,lastPosted,f,day,amount,end)=>{ if(!lastPosted) return; const d=dueDate(addMonths(lastPosted,f),day); if(end && d>end) return;
    const k=daysBetween(t,d); if(k>=0 && k<=nDays) out.push({name,date:d,days:k,amount}); };
  S.assets.forEach(a=>{ if(isInstDebt(a) && num(a.left)>0) add(a.name+' taksiti',a.lastPosted,1,a.day,toTRY(a.inst,a.currency)); });
  S.bes.forEach(b=>{ if(num(b.monthly)>0) add(b.name+' BES katkısı',b.lastPosted,1,b.day,num(b.monthly)); });
  S.policies.forEach(p=>{ if(num(p.premium)>0) add(p.name+' sigorta primi',p.lastPosted,num(p.freq)||1,p.day,toTRY(p.premium,p.currency),p.end); });
  return out.sort((x,y)=>x.days-y.days);
}
function computeAlerts(){
  const out=[], t=today(), m=ym(t), tt=monthTotals(m), day=+t.slice(8), dim=new Date(+t.slice(0,4),+t.slice(5,7),0).getDate(), frac=day/dim;
  const avg={}; lastMonths(4).slice(0,3).forEach(pm=>{ const x=monthTotals(pm).byCat; for(const k in x) avg[k]=(avg[k]||0)+x[k]/3; });
  const fixedCats=[DEBT_CAT,BES_CAT,INS_CAT];
  for(const c of S.settings.expenseCats){
    const lim=effLimit(c), sp=tt.byCat[c]||0, r=lim>0?sp/lim:0;
    if(lim>0 && !fixedCats.includes(c)){
      if(r>=1) out.push({lv:'red',tx:`${c} bütçesi aşıldı: ${money(sp)} / ${money(lim)} (${money(sp-lim)} fazla)`});
      else if(r>=0.8) out.push({lv:'amber',tx:`${c} bütçesi %${nf.format(r*100)} dolu; kalan ${money(lim-sp)}`});
      else if(r>=0.5 && r>frac+0.25) out.push({lv:'amber',tx:`${c}: ayın ${day}. günündesin ama bütçe şimdiden %${nf.format(r*100)} dolu. Bu hızla ay sonunda yaklaşık ${money(sp/frac)} olur (limit ${money(lim)}).`});
    }
    const a=avg[c]||0;
    if(a>0 && sp>a*1.5 && sp-a>=500 && !fixedCats.includes(c) && !(lim>0 && r>=0.8))
      out.push({lv:'amber',tx:`${c} harcaman son 3 ay ortalamasının %${nf.format((sp/a-1)*100)} üzerinde (bu ay ${money(sp)}, ortalama ${money(a)})`});
  }
  if(tt.inc>0 && tt.exp>=tt.inc) out.push({lv:'red',tx:`Bu ay giderler geliri aştı: gelir ${money(tt.inc)}, gider ${money(tt.exp)}`});
  else if(tt.inc>0 && tt.exp>=tt.inc*0.9) out.push({lv:'amber',tx:`Bu ay harcamaların gelirinin %${nf.format(tt.exp/tt.inc*100)} seviyesinde (gelir ${money(tt.inc)}, gider ${money(tt.exp)})`});
  for(const x of S.stocks) if(num(x.price)>0 && num(x.target)>0 && num(x.price)<=num(x.target))
    out.push({lv:'green',tx:`${x.symbol} hedef alım fiyatının altında: ${money2(num(x.price),x.currency)} (hedef ${money2(num(x.target),x.currency)})`});
  for(const x of upcomingPayments(7)) out.push({lv:'info',tx:`${x.days===0?'Bugün':x.days===1?'Yarın':x.days+' gün sonra'} (${fmtDate(x.date)}): ${x.name} ${money(x.amount)}`});
  const ord={red:0,amber:1,green:2,info:3};
  return out.sort((a,b)=>ord[a.lv]-ord[b.lv]);
}
function alertsCard(){
  const al=computeAlerts(); if(!al.length) return '';
  return `<div class="card"><h3>🚨 Uyarılar ve hatırlatmalar</h3>${al.map(a=>`<div class="alert ${a.lv}">${a.lv==='red'?'⛔ ':a.lv==='amber'?'⚠️ ':a.lv==='green'?'💡 ':'📅 '}${esc(a.tx)}</div>`).join('')}</div>`;
}

// ---- Claude raporu ----
function retNumbers(){
  const R=S.retirement, r=R.realReturn/100, n=Math.max(0,R.retireAge-R.age), m=Math.max(0,R.lifeTo-R.retireAge), A=R.monthlyNeed*12;
  const annuity = r!==0 ? A*(1-Math.pow(1+r,-m))/r : A*m, safe = R.wr>0 ? A/(R.wr/100) : annuity, g=Math.pow(1+r,n);
  return {need:safe+R.lump, needMin:annuity+R.lump, fv:R.current*g+(r!==0?R.monthly*12*(g-1)/r:R.monthly*12*n)};
}
function buildReport(){
  const t0=today(), m=ym(t0), t=monthTotals(m), w=worth(), eur=rate('EUR'), L=[];
  const avg={}; lastMonths(4).slice(0,3).forEach(pm=>{ const x=monthTotals(pm).byCat; for(const k in x) avg[k]=(avg[k]||0)+x[k]/3; });
  L.push(`AİLE FİNANS RAPORU — ${mLabel(m)} (rapor tarihi ${fmtDate(t0)}, ayın ${+t0.slice(8)}. günü)`);
  L.push(`Kurlar: 1 € = ${nf2.format(rate('EUR'))} TL, 1 $ = ${nf2.format(rate('USD'))} TL, 1 £ = ${nf2.format(rate('GBP'))} TL`);
  L.push('', '## Bu ay', `Gelir: ${money(t.inc)} | Gider: ${money(t.exp)} | Net: ${money(t.inc-t.exp)}`);
  L.push('Gider kategorileri (bu ay / aylık bütçe / son 3 ay ortalaması):');
  S.settings.expenseCats.forEach(c=>{ const sp=t.byCat[c]||0, lim=effLimit(c), a=avg[c]||0; if(sp||lim||a) L.push(`- ${c}: ${money(sp)} / ${lim?money(lim):'limit yok'} / ${money(a)}`); });
  L.push('', '## Son 6 ay (gelir / gider / net)');
  lastMonths(6).forEach(mm=>{ const x=monthTotals(mm); L.push(`- ${mLabel(mm)}: ${money(x.inc)} / ${money(x.exp)} / ${money(x.inc-x.exp)}`); });
  L.push('', '## Varlıklar ve borçlar', `Toplam varlık: ${money(w.assets)} | Borç: ${money(w.debt)} | Net servet: ${money(w.net)}${eur?` (≈ ${money(w.net/eur,'EUR')})`:''} | Finansal varlıklar: ${money(w.fin)}`);
  S.assets.forEach(a=>L.push(`- ${a.name} (${a.type}): ${a.type==='Borç'?'−':''}${money(assetTRY(a))}${isInstDebt(a)?` — ${num(a.left)} taksit × ${money(num(a.inst),a.currency)}`:''}`));
  if(S.stocks.length){ L.push('', '## Hisse senetleri (hissenin para biriminde)');
    S.stocks.forEach(x=>{ const k=stockCalc(x); L.push(`- ${x.symbol}${x.name?' ('+x.name+')':''}: ${num(x.shares)>0?`${num(x.shares)} adet, maliyet ${money2(num(x.cost),x.currency)}, `:'İZLEME LİSTESİ, '}fiyat ${num(x.price)?money2(num(x.price),x.currency):'yok'}${num(x.shares)>0?`, K/Z %${nf2.format(k.gainPct)}, değer ${money(k.valTRY)}`:''}${num(x.div)?`, yıllık temettü ${money2(num(x.div),x.currency)}/hisse (verim %${nf2.format(k.yld)})`:''}${num(x.target)?`, hedef alım ${money2(num(x.target),x.currency)}`:''}${x.note?`, not: ${x.note}`:''}`); });
    L.push(`Toplam yıllık temettü (brüt): ${money(w.div)}`); }
  if(S.bes.length){ L.push('', '## BES'); S.bes.forEach(b=>{ const v=besVest(b); L.push(`- ${b.name}: kendi ${money(besOwn(b))}, devlet ${money(besState(b))}${(b.funds||[]).length?' (fonlar: '+b.funds.map(f=>`${f.code} ${f.acct==='state'?'devlet':'kendi'} ${money(fundVal(f))}`).join(', ')+')':''}, aylık katkı ${money(num(b.monthly))}, sistemde ${nf2.format(v.yrs)} yıl, hak ediş %${v.pct}`); }); }
  if(S.policies.length){ L.push('', '## Birikimli hayat sigortaları'); S.policies.forEach(p=>L.push(`- ${p.name} (${p.company||'-'}, sigortalı ${p.insured}): birikim ${money(num(p.value),p.currency)}, teminat ${money(num(p.coverage),p.currency)}, prim ${money(num(p.premium),p.currency)} / ${FREQS.find(f=>f[0]===(num(p.freq)||1))[1].toLowerCase()}, başlangıç ${fmtDate(p.start)}, vade ${p.end?fmtDate(p.end):'-'}`)); }
  if(S.goals.length){ L.push('', '## Hedefler'); S.goals.forEach(g=>L.push(`- ${g.name}: ${money(g.saved,g.currency)} / ${money(g.target,g.currency)}${g.date?', hedef tarih '+fmtDate(g.date):''}`)); }
  const R=S.retirement, rn=retNumbers();
  L.push('', '## Emeklilik planı (bugünkü euro ile, reel getiri)', `Yaş ${R.age}, emeklilik yaşı ${R.retireAge}, plan yaşı ${R.lifeTo}; emeklilikte aylık ihtiyaç ${money(R.monthlyNeed,'EUR')}; tek seferlik harcama ${money(R.lump,'EUR')}`,
    `Bugünkü birikim ${money(R.current,'EUR')}, aylık birikim ${money(R.monthly,'EUR')}, reel getiri %${nf2.format(R.realReturn)}, çekim oranı %${nf2.format(R.wr)}`,
    `Gereken sermaye (güvenli) ${money(rn.need,'EUR')}; emeklilikte tahmini birikim ${money(rn.fv,'EUR')}`);
  const al=computeAlerts(); if(al.length){ L.push('', '## Programın uyarıları'); al.forEach(a=>L.push('- '+a.tx)); }
  L.push('', '## Sorularım',
    '1. Harcamalarımda nerede tasarruf edebilirim? Somut önerilerin neler?',
    '2. Mevcut tasarruf ve yatırım temposuyla emeklilik hedefime ulaşabilir miyim? Neyi değiştirmeliyim?',
    '3. Hisse portföyüm ve izleme listem temettü + adil değerin altında alım stratejime uygun mu? Dikkat etmem gereken riskler neler?',
    '4. Borçlarım, BES ve hayat sigortalarım hakkında dikkat etmem gereken bir şey var mı?');
  return L.join('\n');
}
function showReport(){
  const txt=buildReport();
  const o=document.createElement('div'); o.id='overlay';
  o.innerHTML=`<div class="card"><h3>🤖 Claude için aylık rapor</h3>
    <p class="note">Bu metni kopyala, Claude sohbetine yapıştır ve gönder. Hesap numarası gibi bilgiler içermez, sadece tutarlar vardır. İstersen göndermeden önce düzenleyebilirsin.</p>
    <textarea id="repTxt"></textarea>
    <div class="row" style="margin-top:10px"><button class="btn" onclick="copyReport()">📋 Kopyala</button><button class="btn sec" onclick="document.getElementById('overlay').remove()">Kapat</button><span class="note" id="copyMsg"></span></div></div>`;
  document.body.appendChild(o); document.getElementById('repTxt').value=txt;
  o.addEventListener('click',e=>{ if(e.target===o) o.remove(); });
}
async function copyReport(){
  const ta=document.getElementById('repTxt'), msg=document.getElementById('copyMsg');
  try { await navigator.clipboard.writeText(ta.value); }
  catch(e){ ta.select(); document.execCommand('copy'); }
  msg.textContent='✔ Kopyalandı. Şimdi Claude sohbetine yapıştır.';
}

function addTx(ev){
  ev.preventDefault(); const f=ev.target; const amt=num(f.amount.value);
  if(!(amt>0)){ alert('Lütfen geçerli bir tutar girin.'); return; }
  const tx={id:editId||uid(), date:f.date.value||today(), type:f.type.value, category:f.category.value,
            amount:amt, currency:f.currency.value, member:f.member.value, note:f.note.value.trim()};
  if(editId){ const i=S.transactions.findIndex(x=>x.id===editId); if(i>=0) S.transactions[i]=tx; else S.transactions.push(tx); editId=null; }
  else S.transactions.push(tx);
  filterMonth=ym(tx.date); save(); render();
  const af=document.querySelector('form [name=amount]'); if(af) af.focus();
}
function editTx(id){ editId=id; render(); window.scrollTo(0,0); }
function delTx(id){ if(!confirm('Bu işlem silinsin mi?')) return; S.transactions=S.transactions.filter(t=>t.id!==id); save(); render(); }

function budgetTotals(t){ let l=0,s=0; for(const c of S.settings.expenseCats){ const x=effLimit(c); if(x>0){ l+=x; s+=t.byCat[c]||0; } } return {l,s}; }
function setBudget(inp){
  const c=inp.dataset.cat, v=num(inp.value);
  if(v>0) S.budgets[c]=v; else delete S.budgets[c];
  save();
  const t=monthTotals(ym(today())), sp=t.byCat[c]||0, lim=effLimit(c);
  document.getElementById('bs-'+inp.dataset.i).innerHTML = lim>0?barHtml(sp,lim):'';
  const tt=budgetTotals(t);
  document.getElementById('bt-s').textContent=money(tt.s);
  document.getElementById('bt-l').textContent=money(tt.l);
  document.getElementById('bt-b').innerHTML=tt.l?barHtml(tt.s,tt.l):'';
}
function addCat(ev){
  ev.preventDefault(); const f=ev.target, c=f.cat.value.trim(); if(!c) return;
  if(S.settings.expenseCats.some(x=>x.toLocaleLowerCase('tr')===c.toLocaleLowerCase('tr'))){ alert('Bu kategori zaten var.'); return; }
  S.settings.expenseCats.push(c); if(num(f.lim.value)>0) S.budgets[c]=num(f.lim.value);
  save(); render();
}
function delCat(c){
  if(S.settings.expenseCats.length<=1){ alert('En az bir gider kategorisi kalmalı.'); return; }
  const used=S.transactions.filter(t=>t.type==='gider'&&t.category===c).length;
  if(!confirm(`"${c}" kategorisi silinsin mi?`+(used?`\n\nBu kategoride ${used} eski işlem var; onlar silinmez, adları korunur.`:''))) return;
  S.settings.expenseCats=S.settings.expenseCats.filter(x=>x!==c); delete S.budgets[c];
  save(); render();
}

function divCalendar(own){

  if(!per.some(v=>v>0) && !noMonth.length) return '';
  const max=Math.max(1,...per), W=600, H=150, bw=W/12;
  let svg=`<svg viewBox="0 0 ${W} ${H+40}" width="100%" role="img" aria-label="Aylık temettü takvimi">`;

    svg+=`<rect x="${(x+bw*0.18).toFixed(1)}" y="${(H-hh).toFixed(1)}" width="${(bw*0.64).toFixed(1)}" height="${hh.toFixed(1)}" fill="#1f6f5c" rx="3"><title>${AYLAR[i]}: ${money(v)}</title></rect>`;

    svg+=`<text x="${(x+bw/2).toFixed(1)}" y="${H+18}" text-anchor="middle" font-size="12" fill="#6b7385">${AYLAR[i]}</text>`; });
  svg+=`</svg>`;
  return `<div class="card"><h3>📅 Temettü takvimi (tahmini, brüt, TL)</h3>${svg}${noMonth.length?`<p class="note">Ödeme ayı girilmemiş: ${noMonth.map(esc).join(', ')} (düzenle → Temettü ayları).</p>`:''}</div>`;
}

async function fetchPrices(manual,ids){
  const key=S.settings.avKey;
  if(!key){ if(manual) alert("Önce Ayarlar & Yedek sekmesinden ücretsiz Alpha Vantage anahtarını gir."); return; }
  if(priceBusy){ if(manual) alert('Fiyatlar şu an güncelleniyor, lütfen bekle.'); return; }
  const list=S.stocks.filter(x=>x.symbol && (ids ? ids.includes(x.id) : (manual || x.priceDate!==today())));
  if(!list.length){ if(manual) alert('Güncellenecek hisse yok.'); return; }
  priceBusy=true; let ok=0, fail=[], limit=false;
  const setMsg=t=>{ priceMsg=t; const el=document.getElementById('priceMsg'); if(el) el.textContent=t; updateStatus(); };
  for(let i=0;i<list.length;i++){
    const x=list[i]; setMsg(`⏳ Hisse fiyatları alınıyor: ${i+1}/${list.length} (${x.symbol})`+(list.length>1?' · ücretsiz plan dakikada 5 sorguya izin verdiği için yavaş ilerler':''));
    try {
      const d=await getJSON(AV_URL+'function=GLOBAL_QUOTE&symbol='+encodeURIComponent(x.symbol)+'&apikey='+encodeURIComponent(key));
      const q=d['Global Quote'], p=q && parseFloat(q['05. price']);
      if(p>0){ x.price=p; x.priceDate=today(); x.changePct=parseFloat(String(q['10. change percent']||'').replace('%','')); ok++; save(); }
      else { fail.push(x.symbol); const m=avErr(d); if(/per day|daily|25 requests/i.test(m)){ limit=true; break; } }
    } catch(e){ fail.push(x.symbol); }
    if(i<list.length-1) await new Promise(r=>setTimeout(r,13000));
  }
  priceBusy=false;

// ---- BES ----
function besVest(b){
  const st=b.vestStart||b.start, months=st?Math.max(0,monthsBetween(st,today())):0, yrs=months/12, age=num(S.retirement.age);
  let pct = yrs<3?0 : yrs<6?15 : yrs<10?35 : (age>=56?100:60);
  if(b.vestPct!==undefined && b.vestPct!==null && b.vestPct!=='') pct=num(b.vestPct);   // şirket belgesindeki oran
  return {months,yrs,pct};
}
// Fon bazlı BES: her fon için hesap (kendi/devlet), pay adedi, fiyat ve yeni katkı dağılımı tutulur.
const BES_PRICE_URL='prices/emk.json';
let fundMsg='';
function besFunds(b,acct){ return (b.funds||[]).filter(f=>f.acct===acct); }
function fundVal(f){ return f.pendingAmount!=null ? num(f.pendingAmount) : num(f.units)*num(f.price); }
function besOwn(b){ const fs=besFunds(b,'own'); return fs.length ? fs.reduce((s,f)=>s+fundVal(f),0)+num(b.ownCash) : num(b.own); }
function besState(b){ const fs=besFunds(b,'state'); return fs.length ? fs.reduce((s,f)=>s+fundVal(f),0)+num(b.stateCash) : num(b.state); }
function besVested(b){ return besOwn(b)+besState(b)*besVest(b).pct/100; }
// Aylık katkıyla fon payı alınır (dağılım oranlarına göre); fon yoksa tutar doğrudan eklenir
function besInvest(b,ownAmt,stateAmt){
  for(const [acct,amt] of [['own',ownAmt],['state',stateAmt]]){
    if(!(amt>0)) continue;
    const all=besFunds(b,acct), fs=all.filter(f=>num(f.price)>0 && num(f.alloc)>0), tot=fs.reduce((s,f)=>s+num(f.alloc),0);
    if(!all.length) b[acct]=num(b[acct])+amt;
    else if(tot>0) fs.forEach(f=>{ f.units=num(f.units)+amt*num(f.alloc)/tot/num(f.price); });
    else b[acct+'Cash']=num(b[acct+'Cash'])+amt;   // dağılım yoksa nakit olarak bekler
  }
}
function histPrice(x,date){
  const h=x.hist||{}; if(!date) return num(x.price);
  const ds=Object.keys(h).filter(d=>d<=date).sort();
  if(ds.length) return num(h[ds[ds.length-1]]);
  return Object.keys(h).length ? 0 : num(x.price);   // geçmiş yoksa güncel fiyat
}
async function fetchFundPrices(manual){
  const all=S.bes.flatMap(b=>b.funds||[]);
  if(!all.length){ if(manual) alert('Önce bir sözleşmeye fon ekle.'); return; }
  fundMsg='⏳ BES fon fiyatları alınıyor…'; updateStatus();
  try {
    const d=await getJSON(BES_PRICE_URL+'?t='+Date.now()), F=d.funds||{}; let ok=0; const miss=new Set();
    for(const f of all){
      const x=F[String(f.code).toUpperCase()];
      if(x && num(x.price)>0){
        if(f.pendingAmount!=null){   // belgedeki tutarı, belge tarihindeki fiyatla pay adedine çevir
          const p=histPrice(x,f.pendingDate);
          if(p>0){ f.units=num(f.pendingAmount)/p; delete f.pendingAmount; delete f.pendingDate; }
        }
        if(!f.priceDate || x.date>=f.priceDate){ f.price=num(x.price); f.priceDate=x.date; if(!f.name && x.title) f.name=x.title; }
        ok++; }
      else miss.add(f.code);
    }
    S.settings.fundsDate=today(); save();
    const dates=all.map(f=>f.priceDate).filter(Boolean).sort();
    fundMsg='🏦 BES fon fiyatları güncel'+(dates.length?' ('+fmtDate(dates[dates.length-1])+')':'')+(miss.size?' · fiyatı gelmeyen: '+[...miss].join(', '):'');
  } catch(e){
    fundMsg='⚠️ BES fon fiyatları alınamadı'+(location.protocol==='file:'?' (programı internet adresinden açmalısın)':'');
    if(manual) alert(fundMsg+'. Fiyatları elle de girebilirsin.');
  }
  updateStatus(); if(manual || !formDirty()) render();
}

function addBes(ev){
  ev.preventDefault(); const f=ev.target, old=editBes?S.bes.find(x=>x.id===editBes):null;
  const b={...(old||{}), id:editBes||uid(), name:f.name.value.trim(), contractNo:f.contractNo.value.trim(), monthly:num(f.monthly.value),
           day:Math.min(31,Math.max(1,Math.round(num(f.day.value))||1)), start:f.start.value, rate:num(f.rate.value),
           own:old?num(old.own):0, state:old?num(old.state):0, funds:old&&old.funds?old.funds:[], lastPosted:old&&old.lastPosted?old.lastPosted:''};
  if(b.monthly>0 && !b.lastPosted) initRecurring(b, b.monthly, 'TRY', b.name+' BES katkısı', BES_CAT, 'Birikim tutarlarını');

}

function editBesFn(id){ editBes=id; render(); window.scrollTo(0,0); }
function delBes(id){ if(!confirm('Bu BES sözleşmesi silinsin mi? (Geçmiş katkı giderleri silinmez.)')) return; S.bes=S.bes.filter(b=>b.id!==id); save(); render(); }
function addFund(ev,bid){
  ev.preventDefault(); const f=ev.target, b=S.bes.find(x=>x.id===bid); if(!b) return;
  const code=f.code.value.trim().toUpperCase(), acct=f.acct.value;
  b.funds=b.funds||[];
  if(b.funds.some(x=>x.code===code && x.acct===acct)){ alert(code+' bu hesapta zaten var; pay adedini tablodan düzeltebilirsin.'); return; }
  if(!besFunds(b,acct).length){ b[acct]=0; b[acct+'Cash']=0; }   // artık tutar fonlardan hesaplanacak
  const units=num(f.units.value), amount=num(f.amount.value);
  if(!(units>0) && !(amount>0)){ alert('Pay adedini ya da fonun bugünkü tutarını gir.'); return; }

  if(!(units>0)){ nf.pendingAmount=amount; nf.pendingDate=today(); }   // fiyat gelince pay adedine çevrilir
  b.funds.push(nf);
  save(); render(); fetchFundPrices(false);
}
function setFund(bid,i,k,v){
  const b=S.bes.find(x=>x.id===bid); if(!b||!b.funds[i]) return; const f=b.funds[i];
  f[k]=num(v); if(k==='price') f.priceDate=today();
  if(k==='units'){ b[f.acct+'Cash']=0; delete f.pendingAmount; delete f.pendingDate; }   // pay adedi elle düzeltildiyse bekleyen katkı sıfırlanır
  save(); render();
}
function delFund(bid,i){ const b=S.bes.find(x=>x.id===bid); if(!b||!confirm(b.funds[i].code+' fonu silinsin mi?')) return; b.funds.splice(i,1); save(); render(); }
// Claude'un BES PDF'lerinden hazırladığı dosyayı içe aktarır
async function importBes(inp){
  const file=inp.files[0]; inp.value=''; if(!file) return;
  let d; try { d=JSON.parse(await file.text()); } catch(e){ alert('Dosya okunamadı.'); return; }
  if(!d || d.type!=='aile-finans-bes' || !Array.isArray(d.contracts)){ alert('Bu dosya bir Aile Finans BES dosyası değil.'); return; }
  const lines=d.contracts.map(c=>`• ${c.name}${c.contractNo?' ('+c.contractNo+')':''}: ${(c.funds||[]).length} fon`);
  if(!confirm('Şu BES bilgileri içe aktarılacak:\n\n'+lines.join('\n')+'\n\nAynı sözleşme programda varsa fonları ve pay adetleri dosyadakiyle değiştirilir. Devam?')) return;
  let added=0, updated=0;
  for(const c of d.contracts){
    const norm=x=>String(x||'').toLocaleLowerCase('tr').trim();
    let b=S.bes.find(x=>(c.contractNo && x.contractNo && norm(x.contractNo)===norm(c.contractNo)) || norm(x.name)===norm(c.name));
    const funds=(c.funds||[]).map(f=>{ const o={acct:f.acct==='state'?'state':'own', code:String(f.code||'').toUpperCase(), name:f.name||'', units:num(f.units), price:num(f.price), priceDate:f.priceDate||'', alloc:num(f.alloc)};
      if(f.amount!=null && !num(f.units)){ o.pendingAmount=num(f.amount); o.pendingDate=f.amountDate||''; }
      return o; });
    if(b){
      ['name','contractNo','company','holder','note','start','vestStart','vestPct','own','state','day','rate','monthly'].forEach(k=>{ if(c[k]!==undefined && c[k]!=='' && c[k]!==null) b[k]= ['day','rate','monthly','vestPct','own','state'].includes(k)?num(c[k]):c[k]; });
      if(funds.length){ b.funds=funds; b.ownCash=0; b.stateCash=0; if(besFunds(b,'own').length) b.own=0; if(besFunds(b,'state').length) b.state=0; }
      if(num(b.monthly)>0 && !b.lastPosted) initRecurring(b, b.monthly, 'TRY', b.name+' BES katkısı', BES_CAT, 'Fon pay adetlerini');
      updated++;
    } else {
      b={id:uid(), name:c.name||'BES', contractNo:c.contractNo||'', company:c.company||'', holder:c.holder||'', note:c.note||'', start:c.start||today(), vestStart:c.vestStart||'', vestPct:c.vestPct!=null?num(c.vestPct):null, day:num(c.day)||1, rate:c.rate!=null?num(c.rate):20,
         monthly:num(c.monthly), own:num(c.own), state:num(c.state), funds, lastPosted:''};
      if(b.monthly>0) initRecurring(b, b.monthly, 'TRY', b.name+' BES katkısı', BES_CAT, 'Fon pay adetlerini');
      S.bes.push(b); added++;
    }
  }
  processRecurring(); save(); render();
  alert(`✅ BES bilgileri aktarıldı: ${added} yeni, ${updated} güncellenen sözleşme.`);
  fetchFundPrices(false);
}

// ---- Hayat sigortaları ----
function initPolicy(p,silent){
  const cur=ym(today()), f=num(p.freq)||1, anchor=ym(p.start||today());
  ensureCat(INS_CAT);
  if(anchor>cur){ p.lastPosted=addMonths(anchor,-f); return; }
  const lastDue=addMonths(anchor, Math.floor(monthDiff(anchor,cur)/f)*f);
  if(lastDue!==cur){ p.lastPosted=lastDue; return; }
  const d=dueDate(cur,p.day);
  if(d<=today()){

}

function addPol(ev){
  ev.preventDefault(); const f=ev.target, old=editPol?S.policies.find(x=>x.id===editPol):null;
  const p={id:editPol||uid(), name:f.name.value.trim(), company:f.company.value.trim(), insured:f.insured.value, currency:f.currency.value,
           premium:num(f.premium.value), freq:+f.freq.value, day:Math.min(31,Math.max(1,Math.round(num(f.day.value))||1)),
           start:f.start.value, end:f.end.value, value:num(f.value.value), coverage:num(f.coverage.value), expected:num(f.expected.value), lastPosted:''};
  if(p.end && p.end<=p.start){ alert('Vade sonu başlangıçtan sonra olmalı.'); return; }
  if(old && old.lastPosted && old.freq===p.freq && old.start===p.start && old.day===p.day) p.lastPosted=old.lastPosted;
  else initPolicy(p, !!old);
  if(old){ S.policies[S.policies.indexOf(old)]=p; editPol=null; } else S.policies.push(p);
  processRecurring(); save(); render();
}
function setPol(id,v){ const p=S.policies.find(x=>x.id===id); if(p){ p.value=num(v); save(); render(); } }
function editPolFn(id){ editPol=id; render(); window.scrollTo(0,0); }
function delPol(id){ if(!confirm('Bu poliçe silinsin mi? (Geçmiş prim giderleri silinmez.)')) return; S.policies=S.policies.filter(p=>p.id!==id); save(); render(); }

const RET_FIELDS=[
  ['age','Şu anki yaşın',1],['retireAge','Emeklilik yaşı',1],['lifeTo','Plan yaşı (ömür tahmini)',1],
  ['monthlyNeed','Emeklilikte aylık ihtiyaç (€, bugünkü parayla)',100],['lump','Emeklilikte tek seferlik büyük harcama (€, ör. tekne)',10000],
  ['current','Bugünkü birikim (€)',1000],['monthly','Emekliliğe kadar aylık birikim (€)',100],
  ['realReturn','Yıllık getiri, enflasyon üstü (%)',0.1],['wr','Güvenli çekim oranı (%)',0.1]];
function vEmekli(){
  const R=S.retirement, eur=rate('EUR');
  let h=`<h2>Emeklilik hesaplayıcı</h2><div class="card"><form id="retForm" class="row" onsubmit="return false">`+
    RET_FIELDS.map(([k,l,st])=>`<label style="width:200px">${l}<input type="number" name="${k}" step="${st}" value="${R[k]}" onchange="calcRet()"></label>`).join('')+
    `</form><div class="row" style="margin-top:10px"><button class="btn sec" onclick="useAssets()" ${eur?'':'disabled title="Önce euro kurunu gir"'}>Bugünkü birikimi finansal varlıklarımdan al</button></div>
    <p class="note">Tüm tutarlar <b>bugünkü euro</b> değeriyle; getiri enflasyon düşülmüş (reel) getiridir. Bu sayede enflasyonu ayrıca hesaplamaya gerek kalmaz. Bu bir tahmindir, yatırım tavsiyesi değildir.</p></div>
    <div id="retOut">${retResult()}</div>`;
  return h;
}
function calcRet(){
  const f=document.getElementById('retForm'); const R=S.retirement;
  RET_FIELDS.forEach(([k])=>{ R[k]=num(f[k].value); });
  save(); document.getElementById('retOut').innerHTML=retResult();
}
function useAssets(){
  const eur=rate('EUR'); if(!eur) return;
  S.retirement.current=Math.round(Math.max(0,worth().fin)/eur);
  save(); render();
}
function retResult(){
  const R=S.retirement, r=R.realReturn/100, n=Math.max(0,R.retireAge-R.age), m=Math.max(0,R.lifeTo-R.retireAge), A=R.monthlyNeed*12;
  if(R.lifeTo<=R.age) return `<div class="warn">Plan yaşı şu anki yaştan büyük olmalı.</div>`;
  const annuity = r!==0 ? A*(1-Math.pow(1+r,-m))/r : A*m;
  const safe = R.wr>0 ? A/(R.wr/100) : annuity;
  const need1=safe+R.lump, need2=annuity+R.lump;
  const g=Math.pow(1+r,n);
  const fv = R.current*g + (r!==0 ? R.monthly*12*(g-1)/r : R.monthly*12*n);
  const gap=need1-fv;
  let req=null;
  if(gap>0 && n>0) req = r!==0 ? (need1-R.current*g)*r/(g-1)/12 : (need1-R.current)/n/12;
  // Yıl yıl simülasyon
  let bal=R.current, pts=[], runOut=null;
  for(let a=R.age; a<=R.lifeTo; a++){
    pts.push([a,bal]);
    if(a===R.lifeTo) break;
    if(a<R.retireAge) bal=bal*(1+r)+R.monthly*12;
    else { if(a===Math.max(R.retireAge,R.age)) bal-=R.lump; bal=bal*(1+r)-A; }
    if(bal<0){ if(runOut===null) runOut=a+1; bal=0; }
  }
  const end=pts[pts.length-1][1];
  let h=`<div class="grid">
    ${stat('Gereken sermaye (güvenli, %'+nf2.format(R.wr)+' kuralı)',money(need1,'EUR')+'<div class="note">Para tükenmez, büyük ölçüde korunur</div>')}
    ${stat('Gereken sermaye (para '+R.lifeTo+' yaşında biter)',money(need2,'EUR')+'<div class="note">Daha riskli, alt sınır</div>')}
    ${stat(R.retireAge+' yaşında tahmini birikim',money(fv,'EUR'),fv>=need1?'pos':'')}
  </div><div class="card">`;
  if(gap<=0) h+=`<div class="ok">✅ Mevcut planla güvenli hedefe ulaşıyorsun (fazla: ${money(-gap,'EUR')}).</div>`;
  else if(req!==null) h+=`<div class="warn" style="margin:0">Güvenli hedefe <b>${money(gap,'EUR')}</b> eksik var. Bunu kapatmak için emekliliğe kadar ayda yaklaşık <b>${money(req,'EUR')}</b> biriktirmen gerekir (şu an: ${money(R.monthly,'EUR')}).</div>`;
  else h+=`<div class="warn" style="margin:0">Güvenli hedefe <b>${money(gap,'EUR')}</b> eksik var ve birikim için süre kalmadı.</div>`;
  h+=`<p>${runOut?`⚠️ Mevcut planla paran yaklaşık <b>${runOut} yaşında</b> tükeniyor.`:`Mevcut planla paran ${R.lifeTo} yaşına kadar yetiyor; ${R.lifeTo} yaşında kalan: <b>${money(end,'EUR')}</b>.`}</p>
    <h3>Birikimin yıllara göre seyri (€, bugünkü parayla)</h3>${lineChart(pts,R.retireAge)}</div>`;
  return h;
}
function lineChart(pts,retAge){
  const W=600,H=200,L=62,B=24, maxY=Math.max(1,...pts.map(p=>p[1]));
  const x0=pts[0][0], x1=pts[pts.length-1][0];
  const sx=a=>L+(a-x0)/Math.max(1,x1-x0)*(W-L-10), sy=v=>10+(1-Math.max(0,v)/maxY)*(H-10);
  const d=pts.map((p,i)=>(i?'L':'M')+sx(p[0]).toFixed(1)+' '+sy(p[1]).toFixed(1)).join(' ');
  let s=`<svg viewBox="0 0 ${W} ${H+B}" width="100%" role="img" aria-label="Birikim grafiği">`;
  [0,0.5,1].forEach(f=>{ const y=sy(maxY*f); s+=`<line x1="${L}" x2="${W-10}" y1="${y}" y2="${y}" stroke="#eceef2"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="#6b7385">${short(maxY*f)}</text>`; });
  if(retAge>x0 && retAge<x1){ const x=sx(retAge); s+=`<line x1="${x}" x2="${x}" y1="10" y2="${H}" stroke="#b9770e" stroke-dasharray="4 3"/><text x="${x+6}" y="${H-8}" font-size="11" fill="#b9770e">Emeklilik</text>`; }
  for(let a=Math.ceil(x0/5)*5; a<=x1; a+=5) s+=`<text x="${sx(a)}" y="${H+16}" text-anchor="middle" font-size="11" fill="#6b7385">${a}</text>`;
  return s+`<path d="${d}" fill="none" stroke="#1f6f5c" stroke-width="2.5"/></svg>`;
}

async function saveAvKey(ev){

function saveSettings(ev){
  ev.preventDefault(); const f=ev.target;
  const lines=s=>[...new Set(s.split('\n').map(x=>x.trim()).filter(Boolean))];
  const mem=lines(f.members.value), ex=lines(f.exp.value), inc=lines(f.inc.value);
  if(!ex.length || !inc.length){ alert('En az bir gelir ve bir gider kategorisi olmalı.'); return; }
  S.settings.members=mem; S.settings.expenseCats=ex; S.settings.incomeCats=inc;
  save(); render(); alert('Ayarlar kaydedildi.');
}
function download(name,text,type){
  const b=new Blob([text],{type}); const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
}
async function backup(){
  S.settings.lastBackup=today(); save();
  const text=await makeExport(JSON.stringify(S), LOCK?DK:null, LOCK);
  download('aile-finans-yedek-'+today()+(LOCK?'-sifreli':'')+'.json', text, 'application/json'); render();
}
function loadData(d){ S=merge(defaults(),d); editId=null; editAsset=null; editBes=null; editPol=null; processRecurring(); }
function restore(inp){
  const f=inp.files[0]; inp.value=''; if(!f) return;
  f.text().then(readExport).then(d=>{
    if(!confirm('Yedekteki veriler yüklenecek ve şu anki verilerin YERİNİ alacak. Devam edilsin mi?')) return;
    loadData(d); save(); render(); alert('Yedek yüklendi.');
  }).catch(e=>alert('Yüklenemedi: '+e.message));
}
const FTYPES=[{description:'Aile Finans verisi',accept:{'application/json':['.json']}}];
async function linkFile(){
  try {
    fileHandle = await window.showSaveFilePicker({suggestedName:'aile-finans-verileri.json', types:FTYPES});
    S.settings.lastBackup=today(); save(); await writeChain; render();
    alert('Tamam! Bundan sonra her değişiklik bu dosyaya da kaydedilecek.\nProgramı bir sonraki açışında "Kayıt dosyasını aç" ile bu dosyayı seç.');
  } catch(e){ if(e.name!=='AbortError') alert('Dosya bağlanamadı: '+e.message); }
}
async function openFile(){
  try {
    const [h] = await window.showOpenFilePicker({types:FTYPES});
    if(h.requestPermission){ const p=await h.requestPermission({mode:'readwrite'}); if(p!=='granted') throw new Error('Dosyaya yazma izni verilmedi.'); }
    const d = await readExport(await (await h.getFile()).text());
    loadData(d); fileHandle=h; S.settings.lastBackup=today(); save(); render();
  } catch(e){ if(e.name!=='AbortError') alert('Açılamadı: '+e.message); }
}
function exportCSV(){
  if(LOCK && !confirm('Excel (CSV) dosyası ŞİFRESİZDİR; açan herkes işlemlerini görebilir. Devam edilsin mi?')) return;
  const rows=[['Tarih','Tür','Kategori','Tutar','Para birimi','TL karşılığı','Kişi','Not']];
  S.transactions.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>rows.push([fmtDate(t.date), t.type==='gelir'?'Gelir':'Gider', t.category,
    String(t.amount).replace('.',','), t.currency, toTRY(t.amount,t.currency).toFixed(2).replace('.',','), t.member, t.note]));
  const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');
  download('aile-finans-islemler-'+today()+'.csv', csv, 'text/csv;charset=utf-8');
}
function resetAll(){
  if(!confirm('TÜM veriler silinecek. Emin misin?')) return;
  if(!confirm('Son kez soruyorum: geri alınamaz. Silinsin mi?')) return;
  S=defaults(); save(); show('ozet');  // kilit (varsa) açık kalır
}

// ---------- Başlat ----------
window.addEventListener('beforeunload',e=>{ if(fileHandle && fileError){ e.preventDefault(); e.returnValue=''; } });
let booted=false;
function boot(){
  processRecurring(); render();
  if(booted) return; booted=true;
  if(S.settings.autoRates && S.settings.ratesDate!==today()) fetchRates(false);
  if(S.settings.avKey && S.stocks.some(x=>x.priceDate!==today())) setTimeout(()=>fetchPrices(false),1500);
  if(S.bes.some(b=>(b.funds||[]).length) && S.settings.fundsDate!==today()) setTimeout(()=>fetchFundPrices(false),800);
}
if(encStored) showLock(); else boot();
// ---------- Kurulum ve güncelleme (PWA) ----------
function showUpdateBar(){
  let b=document.getElementById('updBar');
  if(!b){ b=document.createElement('div'); b.id='updBar'; document.body.appendChild(b); }
  b.innerHTML='🔄 Programın yeni sürümü hazır. <button class="btn" onclick="applyUpdate()">Güncelle</button>';
}
function applyUpdate(){
  const b=document.getElementById('updBar'); if(b) b.innerHTML='⏳ Güncelleniyor…';
  if(swReg && swReg.waiting) swReg.waiting.postMessage('SKIP_WAITING'); else location.reload();
}
async function checkUpdate(){
  if(!swReg){ alert('Güncelleme kontrolü, programın internet adresinden kurulan sürümünde çalışır.'); return; }
  try { await swReg.update(); } catch(e){ alert('Kontrol edilemedi. İnternet bağlantını kontrol et.'); return; }
  if(swReg.waiting || swReg.installing) showUpdateBar(); else alert('Program güncel (sürüm '+APP_VERSION+').');
}
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    swReg=reg;
    if(reg.waiting && navigator.serviceWorker.controller) showUpdateBar();
    reg.addEventListener('updatefound',()=>{ const w=reg.installing; if(w) w.addEventListener('statechange',()=>{ if(w.state==='installed' && navigator.serviceWorker.controller) showUpdateBar(); }); });
    setInterval(()=>reg.update().catch(()=>{}), 60*60*1000);
  }).catch(e=>console.error(e));
  let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(!reloading){ reloading=true; location.reload(); } });
}
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; if(tab==='ayar') render(); });
async function installApp(){ if(!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt=null; render(); }
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
</script>
