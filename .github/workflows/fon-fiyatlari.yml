name: BES fon fiyatları

on:
  schedule:
    - cron: '17 4 * * 1-6'    # 07:17 (TR)
    - cron: '47 15 * * 1-5'   # 18:47 (TR)
  workflow_dispatch:
  push:
    paths:
      - 'prices/fonlar.txt'

permissions:
  contents: write

concurrency:
  group: fon-fiyatlari
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install tefas-crawler==0.6.0
      - run: python scripts/fon_fiyatlari.py
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices/emk.json
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "BES fon fiyatları güncellendi"
          git pull --rebase
          git push
